steps:
  # Step 1: Build the docs
  - name: rust:latest
    args:
      - "-c"
      - |
        cargo install mdbook@0.4.52 mdbook-katex
        mdbook build
    id: BuildDocs
    entrypoint: bash
  # Step 2: Copy file to cloud storage
  - name: 'gcr.io/cloud-builders/gsutil'
    args: ['-m', 'cp', '-r', 'book/*', 'gs://arrakis-docs-prod']
    id: CopyToStorage

options:
  logging: CLOUD_LOGGING_ONLY
  workerPool: projects/$PROJECT_ID/locations/europe-west1/workerPools/arrakis-cicd-private-pool-prod